services:
  web:
    image: ghcr.io/tomovicj/pitchcheck-web:${TAG:-latest}
    build: .
    ports:
      - "3000:3000"
    environment:
      AUDIO_SERVICE_URL: http://audio:8000
    depends_on:
      audio:
        condition: service_healthy
    restart: unless-stopped

  audio:
    image: ghcr.io/tomovicj/pitchcheck-audio:${TAG:-latest}
    build: ./services/audio
    ports:
      - "8000:8000"
    environment:
      GEMMA_MODEL: google/gemma-4-E2B-it # audio input: gemma-4-E2B-it | gemma-4-E4B-it | gemma-4-12B-it
      GEMMA_DEVICE_MAP: ${GEMMA_DEVICE_MAP:-} # empty: auto on GPU, cpu otherwise
      SLIDE_TOKENS: ${SLIDE_TOKENS:-560} # visual tokens per slide: 70 | 140 | 280 | 560 | 1120
      MAX_SLIDES: ${MAX_SLIDES:-20} # pages of a deck that are analyzed
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1200s # first start downloads the Gemma weights
    restart: unless-stopped

volumes:
  models:
