services:
  web:
    image: ghcr.io/tomovicj/pitchcheck-web:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      ANALYSIS_SERVICE_URL: http://analysis:8000
    depends_on:
      analysis:
        condition: service_healthy
    restart: unless-stopped

  analysis:
    image: ghcr.io/tomovicj/pitchcheck-analysis:${TAG:-latest}
    build: ./services/analysis
    ports:
      - "8000:8000"
    environment:
      GEMMA_MODEL: ${GEMMA_MODEL:-google/gemma-4-E2B-it} # audio input: gemma-4-E2B-it | gemma-4-E4B-it | gemma-4-12B-it
      GEMMA_DEVICE_MAP: ${GEMMA_DEVICE_MAP:-} # empty: auto on GPU, cpu otherwise
      GEMMA_DTYPE: ${GEMMA_DTYPE:-auto} # float16 on GPUs without bf16, such as the T4
      SLIDE_TOKENS: ${SLIDE_TOKENS:-560} # visual tokens per slide: 70 | 140 | 280 | 560 | 1120
      MAX_SLIDES: ${MAX_SLIDES:-20} # pages of a deck that are analyzed
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-20} # longest audio segment sent to Gemma, at most 30
      PITCH_TOPICS: ${PITCH_TOPICS:-} # the event's own topics as JSON, name to meaning; empty for the default six
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1200s # first start downloads the Gemma weights
    restart: unless-stopped

volumes:
  models:
